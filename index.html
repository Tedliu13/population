<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Population</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <main class="main-grid">
      <section class="chart-panel">
        <header class="side-header">
          <div>
            <h1 data-i18n="title">台灣鄉鎮人口推估查詢</h1>
          </div>
          <label class="language-switch">
            <span class="visually-hidden" data-i18n="language">語言</span>
            <select id="languageSelect" aria-label="語言">
              <option value="zh">繁體中文</option>
              <option value="en">English</option>
            </select>
          </label>
        </header>

        <div class="comparison-tabs" role="tablist" aria-label="Comparison">
          <button id="scenarioTab" type="button" role="tab" aria-selected="true" data-i18n="scenarioComparison">情境比較</button>
          <button id="methodTab" type="button" role="tab" aria-selected="false" data-i18n="methodComparison">推估方法比較</button>
        </div>
        <section class="controls side-controls">
          <label id="comparisonScenarioField" hidden>
            <span data-i18n="scenario">情境</span>
            <select id="comparisonScenarioSelect"></select>
          </label>
          <label id="trendTypeField">
            <span data-i18n="trendType">趨勢推估類型</span>
            <select id="trendTypeSelect">
              <option value="mixed:0.95" data-i18n="mixed095">混合型 φ =0.95</option>
              <option value="mixed:0.9" selected data-i18n="mixed09">混合型 φ =0.9</option>
              <option value="mixed:0.8" data-i18n="mixed08">混合型 φ =0.8</option>
              <option value="linear" data-i18n="linear">線性</option>
              <option value="exponential" data-i18n="exponential">指數</option>
            </select>
          </label>
          <label>
            <span data-i18n="mapMetric">地圖選擇</span>
            <select id="mapMetricSelect">
              <option value="shareTrend">平均人口占比變化量</option>
              <option value="population" data-i18n="population">人口數</option>
              <option value="changeFrom2025" data-i18n="change">相對2025年人口改變量</option>
            </select>
          </label>
          <label>
            <span data-i18n="sampleYears">樣本年數</span>
            <select id="sampleWindowSelect">
              <option value="5y_2021_2025" data-i18n="years5">5 年</option>
              <option value="10y_2016_2025" data-i18n="years10">10 年</option>
              <option value="18y_2008_2025" data-i18n="years18">18 年</option>
            </select>
          </label>
        </section>

        <div class="panel-header chart-header">
          <div>
            <h2 id="chartTitle">全台</h2>
            <p id="chartSubtitle" hidden></p>
          </div>
          <div class="chart-actions">
            <button id="downloadCsvBtn" type="button" disabled data-i18n="download">下載 CSV</button>
          </div>
        </div>
        <div class="chart-wrapper">
          <svg id="chartSvg" class="chart-svg" aria-label="Population projection chart"></svg>
        </div>
        <div id="townSummary" class="town-summary" hidden></div>
        <div id="scenarioGroup" class="scenario-group" role="group" aria-labelledby="scenarioGroupLabel">
          <span id="scenarioGroupLabel" data-i18n="scenarios">情境</span>
          <div id="scenarioChecklist" class="scenario-checklist"></div>
        </div>
        <div id="methodGroup" class="scenario-group" role="group" aria-labelledby="methodGroupLabel" hidden>
          <span id="methodGroupLabel" data-i18n="trendType">趨勢推估類型</span>
          <div id="methodChecklist" class="scenario-checklist"></div>
        </div>
      </section>

      <section class="map-panel">
        <div class="panel-header">
          <div class="map-title-row">
            <h2 id="mapTitle">全台人口</h2>
            <div class="map-year-row">
              <span data-i18n="year">年份</span>
              <button id="playYearsBtn" type="button" class="play-years-btn">播放</button>
              <input id="yearRange" type="range" min="0" max="0" step="1" value="0">
              <span id="yearValue" class="year-value">2025</span>
            </div>
          </div>
          <div id="legend" class="legend"></div>
        </div>
        <div id="mapContainer" class="map-container">
          <div class="map-toolbar-row">
            <nav id="mapNavigation" class="map-navigation" hidden>
              <button id="backToTaiwanBtn" type="button" data-i18n="allTaiwan">全台</button>
              <button id="backToCountyBtn" type="button" hidden></button>
            </nav>
            <label class="map-palette-row">
              <span data-i18n="palette">圖例顏色</span>
              <select id="paletteSelect">
                <option value="purpleMorandi" data-i18n="purple">紫色</option>
                <option value="roseMorandi" data-i18n="rose">粉色</option>
                <option value="apricotMorandi" data-i18n="apricot">橘色</option>
              </select>
            </label>
            <div class="map-scenario-row">
              <span data-i18n="mapScenario">情境</span>
              <select id="mapScenarioSelect"></select>
            </div>
          </div>
          <svg id="mapSvg" class="map-svg" aria-label="Taiwan township map">
            <g id="mapViewport">
              <g id="townLayer"></g>
              <g id="countyLayer"></g>
              <g id="labelLayer"></g>
            </g>
          </svg>
          <div id="tooltip" class="tooltip hidden"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="./app.js" type="module"></script>
</body>
</html>
